{% extends "base.html" %}
{% block title %}Reset password | PhishGuard{% endblock %}
{% block body_class %}auth-screen{% endblock %}
{% block main_class %}full-bleed{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <span class="auth-eyebrow">🛡 Almost done</span>
    <h2>Set a new password</h2>
    <p class="muted mb-0">Choose something you haven't used before.</p>

    <form method="POST" class="mt-2">
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" required autofocus placeholder="At least 8 characters">
      </div>
      <div class="field">
        <label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" required placeholder="Repeat your password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Update password</button>
    </form>
  </div>
</div>
{% endblock %}
